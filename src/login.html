<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/login.css" />

    <!-- Scripts -->
    <script type="module" src="js/pages/login.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Marah | Login</title>
  </head>
  <body>
    <main id="main-container">
      <div id="login-container">
        <section class="left-panel">
          <a href="index.html" class="arrow-index-back">
            <i class="fa-solid fa-arrow-left"></i>
          </a>
          <div id="logo-container">
            <img src="img/logo_login.png" alt="Logo Marah" />
            <h1 id="frase-login">
              <span>É sempre</span>
              <span>um prazer</span>
              <span>recebê-lo</span>
            </h1>
            <p class="subtitle-left">Acesse sua conta agora mesmo</p>
          </div>
        </section>

        <section id="form-container">
          <div class="header-titles">
            <h2 class="main-title">Login</h2>
            <h3 class="sub-title">Insira seus dados de acesso</h3>
          </div>

          <form id="login-form">
            <div class="input-icon" id="email-input-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" id="email-input" placeholder="EMAIL" />
            </div>

            <div class="input-icon" id="password-input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password-input" placeholder="SENHA" />
              <i class="fa-solid fa-eye" id="toggle-password"></i>
            </div>

            <div class="forgot-pass-wrapper">
              <a href="recuperar_senha.html" class="forgot-link"
                >Esqueceu sua senha?</a
              >
            </div>

            <p id="login-error" class="error-message"></p>

            <button type="submit" id="btn-submit" class="btn-submit">
              ENTRAR
            </button>
          </form>

          <a href="cadastro.html" id="link-account"
            >Ainda não tem uma conta? Criar conta</a
          >
        </section>
      </div>
    </main>
  </body>
</html>
