<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonte -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Logo do Navegador -->
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/perfil.css" />

    <!-- Header -->
    <link rel="stylesheet" href="css/components/header.css" />

    <!-- Footer -->
    <link rel="stylesheet" href="css/components/footer.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Marah/Perfil</title>
  </head>
  <body>
    <!-- Navegação da parte de cima -->
    <header id="header"></header>

    <!-- Conteudo Principal -->
    <main id="main-container">
      <!-- Parte da esquerda -->
      <section id="left-section">
        <img id="user-img-preview" src="img/perfil.png" />

        <input type="file" id="user-img-input" accept="image/*" hidden />

        <div class="input-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email-input" placeholder="Email" disabled />
        </div>

        <div class="input-icon" id="password-input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password-input" placeholder="SENHA" />
          <i class="fa-solid fa-eye" id="toggle-password"></i>
        </div>
        <div class="input-icon" id="password-again-input-icon">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password-again-input"
            placeholder="CONFIRMAR SENHA"
          />
          <i class="fa-solid fa-eye" id="toggle-password-again"></i>
        </div>

        <button class="btn" id="btn-alterar-senha">Alterar Senha</button>
      </section>

      <!-- Parte da direita -->
      <section id="right-section">
        <div id="form-container">
          <form action="#" id="form-aditional-informations">
            <h3>Nome:</h3>
            <div class="input-icon" id="nome-input-icon">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                id="nome-input"
                class="input-profile"
                placeholder="Nome"
              />
            </div>
            <h3>Dados para Contato:</h3>

            <div id="contact">
              <div class="input-icon" id="telefone-input-icon">
                <i class="fa-solid fa-phone"></i>
                <input
                  type="text"
                  id="number-input"
                  placeholder="Número de Celular"
                  maxlength="15"
                />
              </div>

              <div class="input-icon" id="email-input-icon">
                <i class="fa-solid fa-envelope"></i>
                <input
                  type="email"
                  id="email-input-right"
                  placeholder="Email"
                  disabled
                />
              </div>
            </div>

            <h3>Endereço:</h3>

            <!-- Para o input do Cep e o botão -->
            <div id="cep">
              <div class="input-icon" id="cep-input-icon">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="text"
                  id="cep-input"
                  placeholder="CEP"
                  autocomplete="nope"
                />
              </div>
              <button type="button" class="btn" id="limpar-btn">Limpar</button>
              <div id="cep-error" class="hide">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <p>CEP inválido ou não encontrado</p>
              </div>
            </div>

            <!-- Para os campos depois do cep -->
            <div id="address">
              <div class="input-icon" id="input-endereco">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="text"
                  id="endereco-input"
                  placeholder="Endereço"
                  disabled
                />
              </div>

              <div class="input-icon" id="input-bairro">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="text"
                  id="bairro-input"
                  placeholder="Bairro"
                  disabled
                />
              </div>

              <div class="input-icon" id="numero-input-icon">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input type="number" id="numero-input" placeholder="Nº" />
              </div>

              <select name="Estado" id="state-select" disabled>
                <option value="teste">Selecione</option>
              </select>

              <select name="Cidade" id="city-select" disabled>
                <option value="teste">Selecione</option>
              </select>
            </div>

            <input type="submit" id="alterar-btn" class="btn" value="Alterar" />
          </form>

          <div id="modal-confirmacao" class="modal hidden">
            <div class="modal-content">
              <h3>Confirmar</h3>
              <p>
                Tem certeza que deseja <span>deletar</span> esta informação?
              </p>

              <div class="modal-actions">
                <button id="cancelar-btn" class="btn">Cancelar</button>
                <button id="confirmar-btn" class="danger btn">Excluir</button>
              </div>
            </div>
          </div>

          <div id="modal-feedback" class="modal hidden">
            <div class="modal-content">
              <h3 id="feedback-title">Confirmar</h3>
              <p>
                <span id="feedback-type-span">Sucesso</span> ao
                <span id="feedback-span">deletar</span> informações!
              </p>

              <div class="modal-actions">
                <button id="ok-btn" class="btn">Fechar</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
