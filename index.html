<!doctype html>

<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />
    <title>Catalogo de Brinquedos</title>

    <!-- CSS Geral (HomePage) -->
    <link rel="stylesheet" href="css/homepage.css" />

    <!-- Footer -->
    <link rel="stylesheet" href="css/footer.css" />

    <!-- Header -->
    <link rel="stylesheet" href="css/header.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navegação da parte de cima -->
    <header id="header"></header>

    <!-- Conteudo Principal -->
    <main id="main-container">
      <!-- Categorias -->
      <div id="categories-container">
        <!-- Botão da esquerda -->
        <button class="categories-btn prev-categories">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div id="categories-wrapper"><div id="categories-carousel"></div></div>

        <!-- Botão da direita -->
        <button class="categories-btn next-categories">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Marcas -->
      <div id="brands-container">
        Maiores Marcas
        <div id="brands-wrapper">
          <div id="brands-carousel"></div>
        </div>
      </div>

      <!-- Título dos produtos -->
      <h2 id="toysContainer-title">Lista de Produtos</h2>

      <!-- DIV PARA DEIXAR LADO A LADO -->
      <div id="filter-toys">
        <!-- FILTROS -->
        <div id="filters-container">
          <h3>Filtros</h3>
          <button class="dropdown-btn">
            Categorias <i class="fa-solid fa-chevron-down filter-arrow"></i>
          </button>

          <div class="filter-options" id="categories-filter">
            <!-- Onde é carregado as categorias para filtragem -->
          </div>

          <button class="dropdown-btn">
            Marcas <i class="fa-solid fa-chevron-down filter-arrow"></i>
          </button>

          <div class="filter-options" id="brands-filter">
            <!-- Onde é carregado as marcas para filtragem -->
          </div>
        </div>

        <!-- Brinquedos -->
        <div id="toys-container">
          <div id="products-wrapper"></div>
        </div>
      </div>

      <!-- Esta dentro do Main Container para ficar centralizado -->
      <div id="pagination-container"></div>
    </main>

    <!-- Rodapé -->
    <footer id="footer"></footer>
  </body>
</html>
