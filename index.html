<!doctype html>

<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />
    <title>Catalogo de Brinquedos</title>

    <!-- CSS Geral (HomePage) -->
    <link rel="stylesheet" href="css/homepage.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navegação da parte de cima -->
    <header>
      <nav id="navbar">
        <!-- Para o CSS -->
        <div id="navbar-inner">
          <div id="logo-nav">
            <a href="index.html"
              ><img src="img/newlogo.png" alt="Logo do Catalogo de Brinquedos"
            /></a>
          </div>

          <div id="busca-navbar">
            <!-- Desligar Sugestões do Navegadors -->
            <form autocomplete="off">
              <input
                type="text"
                placeholder="Barra de Pesquisa"
                id="search-input"
              />
              <button type="submit" class="btn">
                <i class="fas fa-search"></i>
              </button>
            </form>

            <!-- Sugestões -->
            <div id="suggestions-box"></div>
          </div>

          <div id="actions">
            <button id="favs" class="btn">
              <p>Favoritos <i class="fa-regular fa-heart"></i></p>
            </button>
            <a href="login.html"
              ><button id="login" class="btn" href="login.html">
                <p>Cadastro/Login <i class="fa-regular fa-user"></i></p></button
            ></a>
          </div>
        </div>
      </nav>
    </header>

    <!-- Conteudo Principal -->
    <main id="main-container">
      <!-- Categorias -->
      <div id="categories-container">
        <!-- Botão da esquerda -->
        <button class="categories-btn prev-categories">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div id="categories-wrapper"><div id="categories-carousel"></div></div>

        <!-- Botão da direita -->
        <button class="categories-btn next-categories">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Banner -->
      <div id="banner-container">
        <div id="banner-carousel">
          <div class="banner-slide">
            <img src="img/banner/Banner_1.png" alt="Promoção de Brinquedos" />
          </div>

          <div class="banner-slide">
            <img src="img/banner/Banner_2.png" alt="Novidades" />
          </div>

          <div class="banner-slide">
            <img src="img/banner/Banner_3.png" alt="Ofertas" />
          </div>
        </div>

        <!-- Botões -->
        <button class="banner-btn prev">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button class="banner-btn next">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Marcas -->
      <div id="brands-container">
        Maiores Marcas
        <div id="brands-wrapper">
          <div id="brands-carousel"></div>
        </div>
      </div>

      <div id="toys-container">
        <h2>Teste da lista de Produtos</h2>
        <div id="products-wrapper"></div>
      </div>
    </main>

    <footer id="footer">
      <div id="footer-container">
        <div class="footer-column">
          <img src="img/logoSlogan.png" alt="Logo" />
        </div>

        <div class="footer-column">
          <h3>Categorias</h3>
          <ul>
            <li>Carrinhos</li>
            <li>Bonecas</li>
            <li>Educativos</li>
            <li>Jogos</li>
          </ul>
        </div>

        <div class="footer-column">
          <h3>Ajuda</h3>
          <ul>
            <li>Contato</li>
            <li>Trocas</li>
            <li>Perguntas frequentes</li>
          </ul>
        </div>

        <div class="footer-column">
          <h3>Redes sociais</h3>
          <div class="caixa-icones">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
          </div>
          <h3>Formas de pagamento</h3>
          <div class="caixa-icones">
            <a href="#"><i class="fa-brands fa-pix"></i></a>
            <a href="#"><i class="fa-brands fa-cc-visa"></i></a>
            <a href="#"><i class="fa-brands fa-cc-mastercard"></i></a>
            <a href="#"><i class="fas fa-barcode"></i></a>
          </div>
        </div>
      </div>

      <div id="footer-bottom">
        <p>© 2026 Catálogo de Brinquedos</p>
      </div>
    </footer>
  </body>
</html>
