<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />
    <title>Marah/Recuperar Senha</title>

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/forgot_pass.css" />

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main id="main-container">
      <div id="forgot-container">
        <a href="login.html" class="arrow-index-back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div id="form-container">
          <form action="#" id="forgot-form">
            <h3>Recuperar Senha</h3>
            <div class="input-icon">
              <i class="fa-regular fa-envelope"></i>
              <input
                type="text"
                name="email"
                id="email-input"
                placeholder="Insira seu Email"
              />
            </div>
            <input type="submit" value="Enviar" class="btn-submit" />
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
