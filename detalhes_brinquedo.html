<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />
    <title>Detalhes do Brinquedo</title>

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/detalhes_brinquedo.css" />

    <!-- Header -->
    <link rel="stylesheet" href="css/components/header.css" />

    <!-- Footer -->
    <link rel="stylesheet" href="css/components/footer.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navegação da parte de cima -->
    <header id="header"></header>

    <!-- Conteudo Principal -->
    <main id="main-container">
      <div id="details-container">
        <a href="index.html" class="arrow-index-back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div id="details-content">
          <div id="details-img">
            <img
              src="img/placeholder.png"
              alt="Placholder"
              id="content-toy-img"
            />
          </div>
          <div id="details-info">
            <h1 id="content-toy-title">Nome do Brinquedo</h1>

            <p id="content-toy-brand">Marca: Exemplo</p>

            <button class="dropdown-btn">
              Descrição <i class="fa-solid fa-chevron-down filter-arrow"></i>
            </button>

            <div id="content-toy-description">
              <p>Este é um brinquedo divertido e educativo para crianças.</p>
            </div>

            <p id="content-toy-price">Preço: R$ 99,99</p>

            <div id="buttons-div">
              <!-- Comprar -->
              <button class="btn" id="comprar-btn">Comprar</button>

              <!-- Adicionar ao carrinho -->
              <button class="btn" id="adicionar-carrinho-btn">
                <i class="fa-solid fa-cart-shopping"></i>
              </button>
            </div>

            <!-- CEP -->
            <div id="cep-div">
              <h2>Calcular Frete:</h2>

              <div id="cep-inner">
                <div class="input-icon">
                  <i class="fa-solid fa-location-crosshairs"></i>
                  <input
                    type="text"
                    id="cep-input"
                    placeholder="Digite seu CEP"
                    required
                  />
                </div>

                <button class="btn">Calcular</button>
              </div>

              <div id="cep-info-div" class="hide">
                <div id="cep-price" class="cep-info">
                  <i class="fa-solid fa-truck"></i>

                  <p>
                    Frete para <span id="cep-span">07000-370</span>:
                    <span id="price-span">R$: 19,90</span>
                  </p>
                </div>
                <div id="cep-time" class="cep-info">
                  <i class="fa-regular fa-clock"></i>

                  <p>Prazo de entrega: <span>5 a 7</span> dias úteis</p>
                </div>
              </div>

              <div id="cep-error" class="cep-info hide">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <p>CEP inválido ou não encontrado</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
