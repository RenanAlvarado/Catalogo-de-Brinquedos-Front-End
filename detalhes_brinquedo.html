<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />
    <title>Detalhes do Brinquedo</title>

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/detalhes_brinquedo.css" />

    <!-- Header -->
    <link rel="stylesheet" href="css/components/header.css" />

    <!-- Footer -->
    <link rel="stylesheet" href="css/components/footer.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navegação da parte de cima -->
    <header id="header"></header>

    <!-- Conteudo Principal -->
    <main id="main-container">
      <div id="details-container">
        <div id="details-img">
          <img src="img/placeholder.png" alt="Placholder" id="details-img" />
        </div>
        <div id="details-info">
          <h1>Nome do Brinquedo</h1>

          <p>
            Descrição: Este é um brinquedo divertido e educativo para crianças.
          </p>

          <p>Marca: Exemplo</p>

          <p>Preço: R$ 99,99</p>

          <div id="buttons-div">
            <!-- Comprar -->
            <button class="btn" id="comprar-btn">Comprar</button>

            <!-- Adicionar ao carrinho -->
            <button class="btn" id="adicionar-carrinho-btn">
              <i class="fa-solid fa-cart-shopping"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
