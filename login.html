<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/login.css" />

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Marah/Login</title>
  </head>
  <body>
    <main id="main-container">
      <div id="login-container">
        <a href="index.html" id="arrow-left">
          <i class="fa-solid fa-arrow-left"></i
        ></a>
        <div id="logo-container">
          <img src="img/login_bem-remov.png" alt="Logo" />
          <h1 id="frase-login">
            <span class="linha1">É sempre</span>

            <span class="linha2">um prazer</span>

            <span class="linha3">recebê-lo</span>
          </h1>
        </div>
        <div id="form-container">
          <form action="#" id="login-form">
            <h3 id="title">Login</h3>
            <div class="input-icon">
              <i class="fa-regular fa-user"></i>
              <input
                type="email"
                name="email"
                id="email-input"
                placeholder="Insira seu Email"
              />
            </div>
            <div class="input-icon">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                name="password"
                id="password-input"
                placeholder="Insira sua senha"
              />
            </div>

            <!-- Div criada para deixar tudo lado a lado -->
            <div id="remember-password">
              <div id="remember-me">
                <input type="checkbox" name="lembrar" id="remember-check" />
                <label for="remember-check" class="switch">
                  <span class="slider"></span>
                </label>
                <span id="remember-title">Lembrar</span>
              </div>

              <a href="recuperar_senha.html">Esqueceu a senha?</a>
            </div>

            <input type="submit" value="Login" class="btn-submit" />
          </form>

          <a href="cadastro.html" id="link-account">Criar conta</a>
        </div>
      </div>
    </main>
  </body>
</html>
