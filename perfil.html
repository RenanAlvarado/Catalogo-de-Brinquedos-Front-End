<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonte -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Logo do Navegador -->
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/perfil.css" />

    <!-- Header -->
    <link rel="stylesheet" href="css/components/header.css" />

    <!-- Footer -->
    <link rel="stylesheet" href="css/components/footer.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Marah/Perfil</title>
  </head>
  <body>
    <!-- Navegação da parte de cima -->
    <header id="header"></header>

    <!-- Conteudo Principal -->
    <main id="main-container">
      <!-- Parte da esquerda -->
      <section id="left-section">
        <button id="profile-img-button">
          <img src="img/perfil.png" alt="Placeholder" id="profile-img" />
        </button>

        <div class="input-icon">
          <i class="fa-regular fa-user"></i>
          <input
            type="text"
            id="nome-input"
            class="input-profile"
            placeholder="Nome"
          />
        </div>

        <div class="input-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email-input" placeholder="Email" required />
        </div>

        <button class="btn">Alterar Senha</button>
      </section>

      <!-- Parte da direita -->
      <section id="right-section">
        <div id="form-container">
          <form action="#" id="form-aditional-informations">
            <h3>Dados para Contato:</h3>

            <div id="contact">
              <div class="input-icon">
                <i class="fa-solid fa-phone"></i>
                <input
                  type="number"
                  id="number-input"
                  placeholder="Phone Number"
                  required
                />
              </div>

              <div class="input-icon">
                <i class="fa-solid fa-envelope"></i>
                <input
                  type="email"
                  id="email-input-right"
                  placeholder="Email"
                  required
                />
              </div>
            </div>

            <h3>Endereço:</h3>

            <!-- Para o input do Cep e o botão -->
            <div id="cep">
              <div class="input-icon">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="text"
                  id="cep-input"
                  placeholder="CEP"
                  autocomplete="nope"
                />
              </div>
              <button class="btn">Limpar</button>

              <div id="cep-error" class="hide">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <p>CEP inválido ou não encontrado</p>
              </div>
            </div>

            <!-- Para os campos depois do cep -->
            <div id="address">
              <div class="input-icon" id="input-endereco">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="text"
                  id="endereco-input"
                  placeholder="Endereço"
                  required
                  disabled
                />
              </div>

              <div class="input-icon" id="input-bairro">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="text"
                  id="bairro-input"
                  placeholder="Bairro"
                  required
                  disabled
                />
              </div>

              <div class="input-icon" id="input-numero">
                <i class="fa-solid fa-location-crosshairs"></i>
                <input
                  type="number"
                  id="numero-input"
                  placeholder="Nº"
                  required
                />
              </div>

              <select name="Estado" id="state-select" disabled>
                <option value="teste">Selecione</option>
              </select>

              <select name="Cidade" id="city-select" disabled>
                <option value="teste">Selecione</option>
              </select>
            </div>

            <input type="submit" id="alterar-btn" class="btn" value="Alterar" />
          </form>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
