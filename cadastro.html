<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonte -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Logo do Navegador -->
    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />

    <!-- CSS -->

    <link rel="stylesheet" href="css/register.css" />

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Marah / Cadastro</title>
  </head>

  <body>
    <main id="main-container">
      <div id="register-container">
        <a href="login.html" id="arrow-left">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div id="logo-container">
          <img src="img/marah_cadas-rem.png" alt="Logo" />

          <h1 id="frase-login">Crie sua conta na Marah</h1>
        </div>

        <div id="form-container">
          <form id="register-form">
            <h3 id="title">Cadastro</h3>

            <div class="input-icon">
              <i class="fa-regular fa-user"></i>
              <input type="text" placeholder="Nome completo" required />
            </div>

            <div class="input-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" placeholder="Email" required />
            </div>

            <div class="input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" placeholder="Senha" required />
            </div>

            <div class="input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" placeholder="Confirmar senha" required />
            </div>

            <input type="submit" value="Criar conta" id="btn-submit" />
          </form>

          <a href="login.html" id="link-account">
            Já possui conta? Fazer login
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
