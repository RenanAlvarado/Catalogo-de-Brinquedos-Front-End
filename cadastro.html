<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marah | Cadastro</title>

    <link rel="shortcut icon" href="img/newlogo.png" type="image/x-icon" />

    <!-- CSS GERAL -->
    <link rel="stylesheet" href="css/base/globals.css" />
    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/cadastro.css" />

    <!-- Scripts -->
    <script type="module" src="js/pages/cadastro.js" defer></script>

    <!-- Icones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main id="main-container">
      <div id="register-container">
        <section class="left-panel">
          <a href="login.html" class="arrow-index-back">
            <i class="fa-solid fa-arrow-left"></i>
          </a>
          <div id="logo-container">
            <img src="img/marah_cadas-rem.png" alt="Logo Marah" />
            <h1 id="frase-cadastro">
              <span>Crie sua conta</span>
              <span>na Marah</span>
            </h1>
            <p class="subtitle-left">Catalogo de Brinquedos</p>
          </div>
        </section>

        <section id="form-container">
          <div class="header-titles">
            <h2 class="main-title">Cadastro</h2>
            <h3 class="sub-title">Preencha os campos abaixo</h3>
          </div>

          <form id="register-form">
            <div class="input-icon" id="nome-input-icon">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="nome-input" placeholder="NOME COMPLETO" />
            </div>
            <div class="input-icon" id="email-input-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" id="email-input" placeholder="EMAIL" />
            </div>
            <div class="input-icon" id="password-input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password-input" placeholder="SENHA" />
            </div>
            <div class="input-icon" id="password-again-input-icon">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="password-again-input"
                placeholder="CONFIRMAR SENHA"
              />
            </div>
            <p id="cadastro-error" class="error-message"></p>
            <button type="submit" class="btn-submit">CADASTRAR</button>
          </form>
          <a href="login.html" id="link-account"
            >Já possui conta? Fazer login</a
          >
        </section>
      </div>
    </main>
  </body>
</html>
